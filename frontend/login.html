<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AI Travel Planner</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

    <!-- OVERLAY -->

    <div class="login-overlay">

        <div class="container">

            <div class="row align-items-center min-vh-100">

                <!-- LEFT SIDE -->

                <div class="col-lg-6 text-white">

                    <h1 class="display-3 fw-bold">
                        Welcome Traveler ✈
                    </h1>

                    <p class="lead mt-4">

                        Start your AI-powered travel journey today.

                        Discover beautiful destinations, smart itineraries,
                        hotel recommendations, food spots, travel tips,
                        and budget-friendly adventures — all powered by AI.

                    </p>

                </div>

                <!-- RIGHT SIDE LOGIN CARD -->

                <div class="col-lg-5 offset-lg-1">

                    <div class="login-card shadow-lg">

                        <h2 class="text-center mb-4">
                            Login / Register
                        </h2>

                        <!-- NAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                class="form-control"
                                placeholder="Enter your name"
                            >

                        </div>

                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter your email"
                            >

                        </div>

                        <!-- PHONE -->

                        <div class="mb-4">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="text"
                                id="phone"
                                class="form-control"
                                placeholder="Enter your phone number"
                            >

                        </div>

                        <!-- BUTTON -->

                        <button
                            class="btn btn-primary w-100 btn-lg"
                            onclick="saveUser()"
                        >
                            Continue
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
